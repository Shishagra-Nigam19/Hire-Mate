name: HireMate Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # STAGE 1: Build, Lint & Automated Test
  # ==========================================
  build-and-test:
    name: Build & Run Automated Unit/Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile & Run Test Suite
        run: |
          cd backend
          mvn clean test

      - name: Verify JaCoCo 80% Code Coverage Threshold
        run: |
          cd backend
          mvn jacoco:report jacoco:check

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/

  # ==========================================
  # STAGE 2: Build & Push Docker Container
  # ==========================================
  docker-build-and-push:
    name: Build & Push Production Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub / AWS ECR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hiremate-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/hiremate-backend:${{ github.sha }}

  # ==========================================
  # STAGE 3: Zero-Downtime EC2 Automated Deployment
  # ==========================================
  deploy-to-ec2:
    name: Deploy Container to AWS EC2
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/hiremate
            export DOCKER_IMAGE_TAG=${{ github.sha }}
            ./scripts/deploy.sh
